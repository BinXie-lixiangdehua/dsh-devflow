# DevFlow bundle patch — TWO preset forms live here on purpose.
#
# ── ① 宿主控制器（两版通用，未改）────────────────────────────────────────────
# dsh 0.1.5 与 0.1.7 都按 `dsh.bundle.patch` 加载本文件；该行只挂载 DevFlow 宿主
# bundle 本身（`devflow` 服务、Remote、客户端 slot、`.devflow` store）。
- insert:
    - id: devflow
      name: '@xiaoxie-ide/dsh-devflow'
      config:
        stateDir: .devflow

# ── ② 预设：新形态（0.1.7-rc.1 认，0.1.5 认不出但**不致命**）──────────────────
# 0.1.7 起 agent preset 由「声明行」声明：一个 `@deepseek-ai/dsh-agent-preset`
# 插件行，`config.plugins` 就是该预设的插件清单。旧版的目录式预设
# （`$DSH_HOME/.agent-presets/devflow/`）在新版**没有任何读取方**，因此必须同时
# 具备这一份声明，预设才会出现在新版选择列表里。
#
# 为什么可以和旧形态并存：0.1.5 解析不到 `@deepseek-ai/dsh-agent-preset` 这个
# 包名时，只会把**该预设**记为 broken（`logger.warn` + 名册诊断），不会让宿主
# 启动失败；而目录式那份仍然照旧被 0.1.5 读取。两版各取所需，互不干扰。
#
# ⚠️ 下面 `name:` 用**包内子路径**（`package.json` 的 `exports` 已暴露
#    `./preset-activation`）。**不要**写回相对路径：本行嵌在 `config.plugins` 里，
#    而 app-boot 的路径锚定函数 `anchorInsertedPluginNames`
#    （`packages/boot/app-boot/src/index.ts:346-356`）只在
#    `entry.group && Array.isArray(entry.config)` 时才递归（`:352`），**永远走不到这一行**；
#    相对路径于是以 **profile 目录**为基准（`agent-preset-registry/src/index.ts:108`
#    把挂载基址取成声明行所在树），必然解析不到。子路径是裸名，从 profile 的
#    node_modules 解析，装在哪里都对。
# ⚠️ 本行**出厂即 `disabled: false`**（自本版起），这是「装上即用」的关键：
#    官方插件管理器装完就会装配本 bundle patch，没有第二步。
#    为什么以前必须是 `true`：**0.1.5 遇到「已启用但解析不到」的行会中止启动**，
#    因果链（更正旧注释的归因）：
#      ① vendored cordis loader 先抛：`vendor/loader/src/config/entry.ts:280-282`
#         → `updateError('import', …)`（消息模板 `:26`）→ `config/group.ts:79-80` 重抛；
#      ② app-boot 把它包成 `plugin tree failed to load`
#         （`packages/boot/app-boot/src/index.ts:832`，stage 在 `:803`）；
#      ③ 它的审计 `assertEntriesLoaded`（`:688-694`）也会拒绝「没有 fiber 且未禁用」的行，
#         注释原话「Disabled entries are the only valid」在 `:683-684`（**那是 JSDoc**，
#         不是抛错点；真正的首抛在 ①）。
#      而 0.1.5 里 `@deepseek-ai/dsh-agent-preset` 这个包**不存在**（0.1.5 只有复数名
#      `@deepseek-ai/dsh-agent-presets`）⇒ 启用即必炸，所以当年只能默认禁用。
#    自本版起**不再支持 dsh < 0.1.7**（`install.ps1` 在写任何文件之前就明确拒绝低版本），
#    因此不需要再用禁用来兼容 0.1.5。
#    补充事实（旧注释同样漏了）：**0.1.7/0.2.0 对「非必需行」只 warning、不中断启动**
#    （`auditStartupEntries`，`packages/boot/app-boot/src/index.ts:925-939`：只有
#    bootstrap include 与 `requiredStartupEntryIds` 才 throw）。所以即便某一版暂时
#    解析不到这行声明，最坏也只是「预设不可用」，不会让宿主起不来。
- insert:
    - id: preset-devflow
      name: '@deepseek-ai/dsh-agent-preset'
      disabled: false
      config:
        id: devflow
        name: DevFlow
        description: DevFlow Commander — trusted agent workflow orchestration preset
        order: 50
        plugins:
          # 与旧形态 `agent.cordis.yml` 第 1 行逐字对应（含 `isolate` realm）：
          # 该行提供的 `agentPresetActivation` 是隔离服务，不带 realm 会被新版
          # 注册表的泄漏审计判为 “Preset services require isolate realms”。
          - id: devflow-activation
            name: '@xiaoxie-ide/dsh-devflow/preset-activation'
            isolate:
              agentPresetActivation: true
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
